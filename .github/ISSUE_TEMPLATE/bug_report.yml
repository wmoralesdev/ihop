name: Bug report
description: Report reproducible behavior that is not working as expected.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve IHOP. Please avoid including tokens, passwords, or other secrets in process commands.
  - type: input
    id: version
    attributes:
      label: IHOP version
      description: Run `ihop --version`.
      placeholder: 0.1.0
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      description: Run `node --version`.
      placeholder: v24.0.0
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include the command, expected result, and actual result.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start a server on...
        2. Run...
        3. Select...
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Relevant output
      description: Redact sensitive command arguments before pasting output.
      render: shell
